<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagonal Shield Background -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
  <polygon points="50,12 84,29 84,71 50,88 16,71 16,29" fill="#020617" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 2" />
  
  <!-- Dynamic River/Flood Water Waves -->
  <path d="M22,62 C30,55 38,70 50,62 C62,54 70,69 78,61 L78,76 C70,82 60,84 50,84 C40,84 30,82 22,76 Z" fill="url(#shieldGrad)" opacity="0.6"/>
  <path d="M20,54 C30,46 38,62 50,54 C62,46 70,61 80,53 L80,68 C70,74 60,78 50,78 C40,78 30,74 20,68 Z" fill="url(#waveGrad)"/>

  <!-- AI Pulse & Beacon -->
  <circle cx="50" cy="34" r="7" fill="#0284c7" />
  <circle cx="50" cy="34" r="4" fill="#38bdf8" />
  <circle cx="50" cy="34" r="1.5" fill="#ffffff" />
  
  <!-- Radar Wave Rings -->
  <path d="M38,34 A12,12 0 0,1 62,34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M30,34 A20,20 0 0,1 70,34" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" fill="none" opacity="0.7"/>
  <path d="M24,34 A26,26 0 0,1 76,34" stroke="#06b6d4" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
